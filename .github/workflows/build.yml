name: Build

on:
  push:
    branches: [main]
  workflow_dispatch:   # 允许在 Actions 页手动触发

jobs:
  # ---------- Windows 端（Tauri 2） ----------
  build-windows:
    runs-on: windows-latest   # 自带 Rust / MSVC / WebView2，零环境安装
    defaults:
      run:
        working-directory: windows
    steps:
      - uses: actions/checkout@v5

      - name: 安装 npm 依赖（@tauri-apps/cli）
        run: npm install

      - name: 构建 Tauri（release）
        run: npm run build
        env:
          # 禁用 Tauri 遥测与更新检查
          TAURI_CLI_UPDATE_CHECK: "0"

      - name: 上传 Windows 可执行文件
        uses: actions/upload-artifact@v5
        with:
          name: clipbordcast-windows
          path: windows/src-tauri/target/release/clipbordcast.exe
          retention-days: 30

  # ---------- Android 端（Kotlin + Compose） ----------
  build-android:
    runs-on: ubuntu-latest    # 自带 Android SDK 34，仅需补 JDK 17 与 Gradle
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v5

      - name: JDK 17（AGP 8.5 要求）
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Gradle（仓库未带 wrapper，用官方 action 安装）
        uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: "8.9"

      - name: 构建 Debug APK
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: 上传 Android APK
        uses: actions/upload-artifact@v5
        with:
          name: clipbordcast-android
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
